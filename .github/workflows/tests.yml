name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild the synthetic corpus
        # Regenerating rather than trusting the committed .eml files proves the
        # corpus is reproducible from source and has not drifted from the generator.
        run: python tools/build_corpus.py

      - name: Show regenerated corpus differences
        run: git diff -- data/

      - name: Tests
        run: pytest -q

      - name: Calibration must still hold
        # The thresholds in score.py are calibrated against the corpus in
        # docs/calibration.md. If a weight changes and this step fails, the
        # calibration document needs redoing rather than the check removing.
        run: python -m src.evaluate --confusion

      - name: Ablation
        run: python -m src.ablate

      - name: Lint
        run: ruff check .
